syntax = "proto3";

package billing;

option go_package = "github.com/iskanye/utilities-payment-proto/billing";

service Billing {
    rpc AddBill (Bill) returns (BillResponse);
    rpc GetBills (BillsRequest) returns (stream Bill);
}

message Bill {
    optional int64 bill_id = 1;
    string address = 2;
    int32 amount = 3;
    int64 user_id = 4;
    optional string due_date = 5;
}

message BillResponse {
    int64 bill_id = 1;
}

message BillsRequest {
    int64 user_id = 1;
}